version: "2"
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - go.icytown.com/scaffold
linters:
  default: standard
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - gocheckcompilerdirectives
    - gocritic
    - godox
    - gosec
    - govet
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - staticcheck
    - tagalign
    - tagliatelle
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    funcorder:
      constructor: true
      struct-method: true
      alphabetical: true
    gosec:
      excludes:
        - G115
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: camel
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
