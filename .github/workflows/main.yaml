name: Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  gen-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Gen Example
        run: make gen-example

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Lint Scaffold
        uses: golangci/golangci-lint-action@v9
      - name: Lint Mux
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go/mux
      - name: Lint Example
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: example

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Assert Consistency
        run: diff -ru internal/assert go/mux/internal/assert

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test Scaffold
        run: go test ./... -race -coverprofile=coverage-scaffold.out
      - name: Test Mux
        run: go test ./... -race -coverprofile=../../coverage-mux.out
        working-directory: go/mux
      - name: Test Example
        run: go test ./... -race -coverprofile=../coverage-example.out
        working-directory: example
      - name: Codecov
        uses: codecov/codecov-action@v7
        if: ${{ matrix.go-version }} == 'stable'
        with:
          fail_ci_if_error: true
          files: ./coverage-scaffold.out,./coverage-mux.out,./coverage-example.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
