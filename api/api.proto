edition = "2024";

package api;

option go_package = "go.icytown.com/scaffold/internal/gen/api";

import "google/protobuf/descriptor.proto";

// 空请求或响应。
message Empty {}

// HTTP 接口配置。
message HttpRule {
  string get = 1;
  string post = 2;
  string put = 3;
  string delete = 4;
  string patch = 5;
}

extend google.protobuf.MethodOptions {
  HttpRule http = 100001;
}
