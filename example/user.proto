edition = "2024";

package example;

option go_package = "go.icytown.com/scaffold/example/go/gen";

import "api/api.proto";

// 创建用户请求
message CreateUserRequest {
  // 用户邮箱，登录凭证
  string email = 1;
  // 用户昵称
  string name = 2;
}

// 创建用户响应
message CreateUserResponse {
  // 用户 ID
  // 这是创建用户成功后对应用户的 ID 标识
  int32 user_id = 1;
  // 用户昵称
  string name = 2;
}

// 查询用户请求
message GetUserRequest {
  int32 user_id = 1; // 用户 ID
}

// 查询用户响应
message GetUserResponse {
  int32 user_id = 1; // 用户 ID
  string name = 2; // 用户昵称
}

// 用户服务
service UserService {
  // 创建用户
  // 该接口会返回创建用户的 ID
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (api.http) = {
      post: "/users"
    };
  }

  // 查询用户
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (api.http) = {
      get: "/users/{user_id}"
    };
  }
}
